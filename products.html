<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MashFreshGreens Agriculture | Products</title>
    <meta name="description" content="Browse photos of MashFreshGreens Agriculture's farm, crops, produce and irrigation systems.">
    <meta name="keywords" content="agriculture gallery, farm photos, crops, fresh produce, irrigation system">
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <!--
        CORRECTION (from part 1): the <h1> and <nav> below were previously
        floating outside any <header> element. They are now wrapped in a proper
        <header>, matching every other page, so the header styling in style.css
        (background colour, flex layout, padding) applies consistently here too.
    -->
    <header>
        <h1>MashFreshGreens Agriculture</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="products.html">Products</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>


    <main>
         <!-- Intro text explaining what the gallery below shows -->
        <section>
            <h2>Our Gallery</h2>

            <p>
                Explore our gallery showcasing our agricultural products, services, and sustainable farming practices.
            </p>
                  
        </section>
        <!--           
            CORRECTION (image files): the image files themselves were previously
            nested inside wrongly-named folders (e.g. images/farm.jpg/ was a FOLDER
            containing the real image under a different filename). The images folder
            has been flattened so these src paths now correctly point at real files.

             PART 3: clicking any image opens it in a lightbox overlay (see
            js/script.js) instead of just sitting flat on the page.
        -->

        <section class="gallery">
            <div class="gallery-item">
                <h2>Our Farm</h2>
                <img src="images/farm.jpg" alt="MashFreshGreens Agriculture crop farm" width="600" height="400">
            </div>
            <div class="gallery-item">
                <h2>Our Crops</h2>
                <img src="images/crops.jpg" alt="Crops growing in the fields" width="600" height="400">
            </div>
            <div class="gallery-item">
                <h2>Fresh Produce</h2>
                <img src="images/produce.jpg" alt="Fresh produce from MashFreshGreens" width="600" height="400">
            </div>
            <div class="gallery-item">
                <h2>Irrigation</h2>
                <img src="images/irrigation.jpg" alt="Agricultural irrigation system" width="600" height="400">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MashFreshGreens Agriculture. All rights reserved.</p>
    </footer> 

    <!-- PART 3: Lightbox overlay markup. Hidden by default (.open class toggled by script.js) -->
    <div id="lightbox" class="lightbox">
        <button type="button" id="lightbox-close" class="lightbox-close" aria-label="Close enlarged image">&times;</button>
        <img id="lightbox-img" src="" alt="">
        <p id="lightbox-caption"></p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
